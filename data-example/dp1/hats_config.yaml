metadata:
  release: lsst_dp1

input:
  catalog_path: /datasets/dp1/
  catalog_pattern: "lsst_dp1_scrambled_sample_1000.parq"
  user_selected_cols:
    - objectId
    - coord_ra
    - coord_dec
    - u_<FLUX>Flux
    - g_<FLUX>Flux
    - r_<FLUX>Flux
    - i_<FLUX>Flux
    - z_<FLUX>Flux
    - y_<FLUX>Flux
    - u_<FLUX>FluxErr
    - g_<FLUX>FluxErr
    - r_<FLUX>FluxErr
    - i_<FLUX>FluxErr
    - z_<FLUX>FluxErr
    - y_<FLUX>FluxErr
    - detect_fromBlend
    - detect_isDeblendedModelSource
    - detect_isIsolated
    - refExtendedness
    - tract
    - patch
  is_id_in_index: false
  ra_col: coord_ra
  dec_col: coord_dec

photometry:
  bands: [u, g, r, i, z, y]
  band_case: lower_case
  keep_input_columns: false
  magnitude:
    system: AB
    flux_unit: nJy
  dereddening:
    extinction_coefficients:
      u: 4.81
      g: 3.64
      r: 2.70
      i: 2.06
      z: 1.58
      y: 1.31
  measurements:
    - name: <FLUX>
      input:
        type: flux
        value_pattern: BAND_<FLUX>Flux
        error_pattern: BAND_<FLUX>FluxErr
      output:
        type: <MAG_OR_FLUX>_dered
        value_pattern: BAND_<FLUX><MAG_OR_FLUX>_<DEREDDENING>
        error_pattern: BAND_<FLUX><MAG_OR_FLUX>Err_<DEREDDENING>
  invalid_handling:
    value:
      nonfinite_is_invalid: true
      limit:
        value: 99.0
        comparison: greater_or_equal
        use_absolute: true
      replacement:
        value: 99.0
        when: invalid
    error:
      nonfinite_is_invalid: true
      limit:
        value: 99.0
        comparison: greater_or_equal
        use_absolute: true
      replacement:
        value: 99.0
        when: invalid

output:
  save_as: parquet
  col_for_filename: tract

execution:
  executor: local
  local:
    n_workers: 3
    threads_per_worker: 2
    memory_limit: "4GB"

dust:
  path_to_dustmaps: null
  use_dustmap: null
