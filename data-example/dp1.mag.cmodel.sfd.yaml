input:
  catalog_folder: dp1/
  catalog_pattern: "lsst_dp1_scrambled_sample_1000.parq"
  which_release: LSST_DP1
  user_selected_cols:
    - objectId
    - coord_ra
    - coord_dec
    - u_cModelFlux
    - g_cModelFlux
    - r_cModelFlux
    - i_cModelFlux
    - z_cModelFlux
    - y_cModelFlux
    - u_cModelFluxErr
    - g_cModelFluxErr
    - r_cModelFluxErr
    - i_cModelFluxErr
    - z_cModelFluxErr
    - y_cModelFluxErr
    - detect_fromBlend
    - detect_isDeblendedModelSource
    - detect_isIsolated
    - refExtendedness
    - tract
    - patch
  is_id_in_index: false
  input_col_type: flux
  input_col_model: cModelFlux
  compute_magnitude: true
  compute_dereddening: true
  keep_input_columns_after_filters_or_transformations: false
  col_pattern: BAND_cModelFlux
  err_pattern: BAND_cModelFluxErr
  selected_bands: [u, g, r, i, z, y]
  ra_col: coord_ra
  dec_col: coord_dec
  band_case: lower_case
  use_dustmap: sfd
  filter:
    enabled: false
    column: null
    value: null
    drop_column_after_filter: false
  initial_cut:
    enabled: false
    column: null
    column_type: flux
    mag_value: null
    flux_value: null

output:
  save_as: hats
#  base_path: examples/output/lsst_dp1_cmodel_mag_dered
#  target_rows_per_part: null
#  order_by: null
  col_final_pattern: BAND_cModelMag_dered
  err_final_pattern: BAND_cModelMagErr_dered
  band_case: lower_case
  mag_offset: 31.4
  A_EBV:
    u: 4.81
    g: 3.64
    r: 2.70
    i: 2.06
    z: 1.58
    y: 1.31
#  col_for_filename: tract

invalid_handling:
  replace_invalid_values: true
  how_to_replace_col_values: all
  how_to_replace_err_values: only_with_invalid_col
  cross_invalidate: false
  col_value_to_replace: 99.0
  err_value_to_replace: 99.0
  is_nan_and_inf_invalid_for_col: true
  is_nan_and_inf_invalid_for_err: true
  set_limit_for_col: true
  limit_value_for_col: 99.0
  limit_comparison_for_col: greater_or_equal
  use_absolute_for_col_limits: true
  set_limit_for_err: true
  limit_value_for_err: 99.0
  limit_comparison_for_err: greater_or_equal
  use_absolute_for_err_limits: true
  round_col: false
  round_col_decimal_cases: 5
  round_err: false
  round_err_decimal_cases: 5

dust:
  path_to_dustmaps: null
  use_dustmap: sfd
  distance_col_pc: null
  distance_fixed_pc: null

collection:
  margin_threshold: 10.0
